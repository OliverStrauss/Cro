name: .NET CI

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/dotnet-ci.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/dotnet-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # No packages.lock.json in /api (RestorePackagesWithLockFile isn't set), so
      # setup-dotnet's own `cache: true` has nothing to hash and errors out - caching
      # ~/.nuget/packages directly, keyed on the csproj files, works without that.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('api/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      # Pulling this ~1GB image is most of the wait before tests can start - kick it off
      # now, in the background, so it overlaps with Azurite startup and dotnet restore/build
      # instead of happening serially right before the test step needs it.
      - name: Prefetch Cosmos emulator image
        run: nohup docker pull mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest > /tmp/cosmos-pull.log 2>&1 &
      # Azurite (Blob Storage emulator) needs a custom startup flag that a declarative
      # `services:` block can't pass through (it always runs the image's default command,
      # no args) - run it as a plain docker step instead, same as local dev.
      - name: Start Azurite
        run: |
          docker run -d --name azurite -p 10000:10000 -p 10001:10001 -p 10002:10002 \
            mcr.microsoft.com/azure-storage/azurite:latest \
            azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
      - name: Wait for Azurite to be ready
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:10000/devstoreaccount1 -o /dev/null && break
            sleep 2
          done
      # Targeting the test project explicitly (rather than a bare `dotnet build`) also
      # restores/builds CroApp.Api.csproj via its ProjectReference - no .sln needed.
      - run: dotnet restore CroApp.Api.Tests/CroApp.Api.Tests.csproj
      - run: dotnet build CroApp.Api.Tests/CroApp.Api.Tests.csproj --no-restore
      # The Cosmos emulator is managed manually (not via a declarative `services:` block)
      # so it can be torn down and recreated on failure: the official image occasionally
      # crashes outright under GitHub Actions' resource constraints (a fatal error inside
      # its Windows-compat layer/sqlpal.dll, "Reason: 0x6, Last Chance" - a known issue with
      # this image caused by Docker's default 64MB --shm-size being too small for its storage
      # engine; --shm-size=1g below is the actual fix, not just the retry loop masking it).
      # A crashed `services:` container can't be restarted mid-job, so this also starts a
      # fresh container and retries the whole test run up to 3 times as defense in depth. A
      # genuine test failure (not an emulator crash) still fails every attempt and correctly
      # fails the job - this only masks transient infra flakiness, not real bugs.
      - name: Run tests against the Cosmos emulator, retrying on emulator crashes
        run: |
          # vnext-preview - the same image local Apple Silicon dev already runs (see
          # CLAUDE.md's "Setup - Cosmos DB Emulator") - is GA and documented to support both
          # amd64 (what this runner uses) and ARM64. Replaces the classic x64 image, whose own
          # documented crash bug under GitHub Actions' resource constraints (a fatal error in
          # its Windows-compat layer) is why this retry loop existed - see TECH_DEBT.md for the
          # two prior fix attempts (provisioning dedup, retry-with-backoff) that didn't resolve
          # it because neither addressed the emulator image itself.
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "=== Attempt $attempt/$max_attempts: starting Cosmos emulator ==="
            docker rm -f cosmosdb-emulator >/dev/null 2>&1 || true
            docker run -d --name cosmosdb-emulator \
              -p 8081:8081 -p 1234:1234 \
              mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview

            # vnext-preview serves plain HTTP, not HTTPS - no self-signed cert to handshake
            # against, so this is the same plain-HTTP probe CLAUDE.md already documents for
            # local dev ("poll http://localhost:8081/ (200 once ready)"), not the classic
            # image's auth-free-static-file workaround this replaces.
            ready=false
            for i in $(seq 1 150); do
              curl -sf --max-time 5 http://localhost:8081/ -o /dev/null && { ready=true; break; }
              sleep 2
            done
            if [ "$ready" != "true" ]; then
              echo "Emulator did not become ready in time, retrying with a fresh container..."
              docker logs cosmosdb-emulator 2>&1 | tail -100
              continue
            fi

            if dotnet test CroApp.Api.Tests/CroApp.Api.Tests.csproj --no-build; then
              exit 0
            fi
            echo "Test run failed on attempt $attempt, retrying with a fresh emulator..."
            docker logs cosmosdb-emulator 2>&1 | tail -100
          done
          echo "All $max_attempts attempts failed."
          exit 1
        env:
          CosmosDb__ConnectionString: "AccountEndpoint=http://localhost:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw=="
          BlobStorage__ConnectionString: "UseDevelopmentStorage=true"

  # Deploys to the cro-api App Service (cro-prod resource group) only after tests pass
  # on main - never on a PR. Needs the AZURE_WEBAPP_PUBLISH_PROFILE secret (see the
  # publish-profile download in `az webapp deployment list-publishing-profiles`).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish api/CroApp.Api.csproj -c Release -o api/publish-out
      - uses: azure/webapps-deploy@v3
        with:
          app-name: cro-api
          package: api/publish-out
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

  # Auto-files (or comments on an existing open) GitHub issue when `build` fails on a push to
  # main, so a red main build can't silently go unnoticed the way it did for two days before
  # this job existed - see TECH_DEBT.md. Runs on the workflow's built-in GITHUB_TOKEN, no new
  # secrets. Looks up existing issues by title rather than a label, so it has no dependency on
  # a label existing in the repo first.
  notify-on-failure:
    needs: build
    if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = '.NET CI failing on main';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const existing = openIssues.find((i) => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `.NET CI failed again on \`main\`: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The \`build\` job failed on a push to \`main\`, which blocks \`deploy\` from running.\n\nFailed run: ${runUrl}\n\nClose this issue once \`build\` is green again on \`main\`.`,
              });
            }
