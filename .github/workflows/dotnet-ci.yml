name: .NET CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub-hosted runners are x64, so the standard emulator image works here even
    # though local Apple Silicon dev needs the vnext-preview ARM64 image instead.
    services:
      cosmosdb-emulator:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
        ports:
          - 8081:8081
          - 10251:10251
          - 10252:10252
          - 10253:10253
          - 10254:10254
        env:
          AZURE_COSMOS_EMULATOR_PARTITION_COUNT: "10"
          AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "false"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Azurite (Blob Storage emulator) needs a custom startup flag that the declarative
      # `services:` block above can't pass through (it always runs the image's default
      # command, no args) - run it as a plain docker step instead, same as local dev.
      - name: Start Azurite
        run: |
          docker run -d --name azurite -p 10000:10000 -p 10001:10001 -p 10002:10002 \
            mcr.microsoft.com/azure-storage/azurite:latest \
            azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
      - name: Wait for Cosmos emulator to be ready
        run: |
          for i in $(seq 1 60); do
            curl -sk https://localhost:8081/_explorer/emulator.pem -o /dev/null && break
            sleep 2
          done
      - name: Wait for Azurite to be ready
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:10000/devstoreaccount1 -o /dev/null && break
            sleep 2
          done
      # Targeting the test project explicitly (rather than a bare `dotnet build`) also
      # restores/builds CroApp.Api.csproj via its ProjectReference - no .sln needed.
      - run: dotnet restore CroApp.Api.Tests/CroApp.Api.Tests.csproj
      - run: dotnet build CroApp.Api.Tests/CroApp.Api.Tests.csproj --no-restore
      - run: dotnet test CroApp.Api.Tests/CroApp.Api.Tests.csproj --no-build
        env:
          CosmosDb__ConnectionString: "AccountEndpoint=https://localhost:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw=="
          BlobStorage__ConnectionString: "UseDevelopmentStorage=true"
