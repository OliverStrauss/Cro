name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/flutter-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Deploys to the cro-web Static Web App (cro-prod resource group) only after tests
  # pass on main - never on a PR. Needs the AZURE_STATIC_WEB_APPS_API_TOKEN secret (see
  # `az staticwebapp secrets list -n cro-web`) and MAPTILER_API_KEY. cro-api's hostname
  # is stable (Azure App Service names don't change), so it's fine hardcoded here rather
  # than as its own secret.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          flutter build web --release \
            --dart-define=API_BASE_URL=https://cro-api.azurewebsites.net \
            --dart-define=MAPTILER_API_KEY=${{ secrets.MAPTILER_API_KEY }}
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: app/build/web
          skip_app_build: true
